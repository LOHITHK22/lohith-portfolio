# Portfolio maintenance agents (ASTRA, SCOUT, SYNC, SENTINEL, PULSE, FORGE, SCRIBE).
# Runs on GitHub-hosted runners, so it keeps working while the owner's PC is off.
#
# Safety model:
# - The daily schedule only runs when the repository variable
#   AGENTS_SCHEDULE_ENABLED is "true". Manual dispatch always works.
# - The agents never push to main. They write to the data-only `agent-data`
#   branch and to `agent/*` proposal branches (enforced in scripts/agents/astra.mjs).
# - No paid API keys are used. GITHUB_TOKEN is the only credential.
name: Portfolio agents

on:
  schedule:
    - cron: "23 9 * * *" # 09:23 UTC daily (off-peak minute to avoid queue delays)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: run every check but do not file issues, push branches, or publish results"
        type: boolean
        default: false
      only:
        description: "Comma-separated agents to run (scout,sync,sentinel,pulse,forge). Empty = all"
        type: string
        default: ""
      skip_ci:
        description: "Skip the build + test job (faster)"
        type: boolean
        default: false
      force:
        description: "Run even if a scheduled run already succeeded today"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: portfolio-agents
  cancel-in-progress: false

jobs:
  ci:
    name: SENTINEL · build and tests
    if: >-
      (github.event_name == 'schedule' && vars.AGENTS_SCHEDULE_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' && !inputs.skip_ci)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - id: lint
        continue-on-error: true
        run: npm run lint
      - id: typecheck
        continue-on-error: true
        run: npx tsc --noEmit
      - id: agent_unit_tests
        continue-on-error: true
        run: node --test scripts/agents/tests/*.test.mjs
      - id: build
        continue-on-error: true
        run: npm run build
      - id: e2e
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: npx playwright test
      - name: Record outcomes
        if: always()
        env:
          LINT: ${{ steps.lint.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          UNIT: ${{ steps.agent_unit_tests.outcome }}
          BUILD: ${{ steps.build.outcome }}
          E2E: ${{ steps.e2e.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node -e '
            const e = process.env;
            const steps = { lint: e.LINT, typecheck: e.TYPECHECK, "agent unit tests": e.UNIT, build: e.BUILD, "e2e tests": e.E2E || "skipped" };
            require("fs").writeFileSync("check-results.json", JSON.stringify({ steps, runUrl: e.RUN_URL, sha: process.env.GITHUB_SHA }, null, 2));
            console.log(steps);
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-results
          path: check-results.json
          retention-days: 14

  agents:
    name: ASTRA · run agents
    needs: ci
    if: >-
      always() &&
      ((github.event_name == 'schedule' && vars.AGENTS_SCHEDULE_ENABLED == 'true') ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # agent-data branch + agent/* proposal branches only (enforced in code)
      issues: write # SENTINEL / FORGE issues
      pull-requests: write # FORGE resource-library proposals
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        if: needs.ci.result != 'skipped'
        continue-on-error: true
        with:
          name: check-results
      - name: Run agents
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENTS_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          CHECK_RESULTS: ${{ needs.ci.result != 'skipped' && 'check-results.json' || '' }}
          ONLY: ${{ inputs.only }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: |
          ARGS="$FORCE"
          if [ -n "$ONLY" ]; then ARGS="$ARGS --only=$ONLY"; fi
          git config --global user.name "portfolio-agents[bot]"
          git config --global user.email "portfolio-agents@users.noreply.github.com"
          node scripts/agents/astra.mjs $ARGS
